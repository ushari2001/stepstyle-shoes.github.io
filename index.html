<style>
        /* Reset default margins */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        /* dark bule gradient background with subtle shapes */
        body {
            background: linear-gradient(135deg, #c8d8e4, #f2f2f2);
            position: relative;
         }
  body::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            }


        body::after {
            content: '';
            position: absolute;
            bottom: -80px;
            right: -80px;
            width: 400px;
            height: 400px;}

            
  /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            position: relative;
            z-index: 2;
        }

        
        .company-details {
            display: flex;
            align-items: center;
            text-align: left;
        }

        .company-details svg {
            width: 50px;
            height: 50px;
            margin-right: 15px;
        }

        .company-details h1 {
            margin: 0;
            font-size: 28px;
        }

        .company-details p {
            margin: 3px 0 0 0;
            font-size: 14px;
        }

        nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        nav {
            display: flex;
            align-items: center;
        }

        /* Banner Section */
        .banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 100px 50px;
            position: relative;
            z-index: 1;
        }

        .banner .text {
            max-width: 500px;
        }

        .banner h2 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .banner p {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .banner button {
            background-color: #0d47a1;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Footer */
        footer {
            background-color: rgba(0, 0, 71, 0.9);
            color: white;
            text-align: center;
            padding: 20px;
            font-weight: 300; /* thin line text */
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .banner {
                flex-direction: column;
                text-align: center;
            }

            header {
                flex-direction: column;
            }

            nav {
                margin-top: 10px;
            }

            .company-details {
                justify-content: center;
                margin-bottom: 10px;
     color: white;
