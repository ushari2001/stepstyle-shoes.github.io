<!DOCTYPE html>
<html>
<head>
    <title>Login - StepStyle Shoes</title>
</head>

<body style="margin:0; font-family: Arial; background-color:#ffffff;">

    <!-- Header -->
    <header style="background-color:#1565c0; padding:20px; text-align:center; color:white;">
        <h1>👟 StepStyle Shoes</h1>
    </header>

    <!-- Login Form Section -->
    <section style="display:flex; justify-content:center; align-items:center; height:80vh;">

        <div style="background-color:#e3f2fd; padding:30px; width:300px; border-radius:10px; text-align:center;">

            <h2 style="color:#1565c0;">Login</h2>

            <form action="products.html">

                <label>Email</label><br>
                <input type="email" placeholder="Enter your email" required
                style="width:90%; padding:8px; margin:10px;"><br>

                <label>Password</label><br>
                <input type="password" placeholder="Enter your password" required
                style="width:90%; padding:8px; margin:10px;"><br>

                <button type="submit"
                style="background-color:#1565c0; color:white; padding:10px 20px; border:none;">
                    Login
                </button>

            </form>

        </div>

    </section>

</body>
</html>
